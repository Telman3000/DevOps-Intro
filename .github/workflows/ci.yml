name: ci

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/**'

# Bonus 1: cancel superseded runs on the same PR/branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# Bonus 2: skip VCS stamping with shallow clones
env:
  GOFLAGS: -buildvcs=false

jobs:
  vet:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23', '1.24']
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: app/go.mod
      - name: go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23', '1.24']
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: app/go.mod
      - name: go test
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      # Bonus 3: skip golangci when only docs under app/ changed (e.g. README)
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - 'app/**/*.go'
              - 'app/.golangci.yml'
              - 'app/go.mod'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        if: steps.filter.outputs.go == 'true'
        with:
          go-version-file: app/go.mod
          cache: true
          cache-dependency-path: app/go.mod
      - uses: golangci/golangci-lint-action@1481404843c368bc19ca9406f87d6e0fc97bdcfd # v7.0.0
        if: steps.filter.outputs.go == 'true'
        with:
          version: v2.5.0
          working-directory: app
          install-mode: binary
          skip-cache: false
      - name: lint skipped (docs-only under app/)
        if: steps.filter.outputs.go != 'true'
        run: echo "No Go/lint-config changes — skipping golangci-lint"

  ci-ok:
    if: always()
    needs: [vet, test, lint]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
