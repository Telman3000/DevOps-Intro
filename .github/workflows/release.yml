# Lab 10 — tag → build → push to ghcr.io → (optional) redeploy Render
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  # ghcr.io requires lowercase owner/repo
  IMAGE_NAME: quicknotes

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Image metadata
        id: meta
        run: |
          OWNER_REPO=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          VERSION="${GITHUB_REF_NAME}"
          IMAGE="ghcr.io/${OWNER_REPO}/${IMAGE_NAME}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Will push: ${IMAGE}:${VERSION} and :latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy (image hook)
        # Secret = full Deploy Hook URL from Render. Never commit it.
        # Skip cleanly when unset (secrets cannot be used in `if:` reliably).
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMG: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "RENDER_DEPLOY_HOOK not set — skipping Render redeploy"
            exit 0
          fi
          ENCODED=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['IMG'], safe=''))")
          if [[ "${RENDER_DEPLOY_HOOK}" == *"?"* ]]; then
            URL="${RENDER_DEPLOY_HOOK}&imgURL=${ENCODED}"
          else
            URL="${RENDER_DEPLOY_HOOK}?imgURL=${ENCODED}"
          fi
          echo "Calling Render deploy hook for ${IMG}"
          curl -fsS -X GET "$URL"
          echo
          echo "Render deploy triggered."
